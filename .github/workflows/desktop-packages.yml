name: Native Desktop Packages

on:
  workflow_dispatch:

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  actions: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  PASEO_NATIVE_RELEASE: "1"
  PASEO_UPDATE_REPOSITORY: emotionbug/Passession
  SOURCE_SHA: ${{ github.sha }}
  GOMODCACHE: ${{ github.workspace }}/target/paseo-tailnet/modules
  GOCACHE: ${{ github.workspace }}/target/paseo-tailnet/go-cache

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-release-linux-x64
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Plan changed Linux components without publication
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask components plan --targets linux-x64 --output artifacts/component-plan.json
          jq -r '"no_changes=\(.noChanges)", "build=\(.targets[0].build | tojson)", "package=\(.targets[0].package)"' artifacts/component-plan.json >> "$GITHUB_OUTPUT"
          jq -r '"RELEASE_VERSION=\(.version)", "SOURCE_TAG=v\(.version)", "PASEO_RELEASE_CHANNEL=\(.channel)"' artifacts/component-plan.json >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        if: contains(fromJSON(steps.plan.outputs.build), 'tailnet') || contains(fromJSON(steps.plan.outputs.build), 'update-helper')
        with:
          go-version-file: packages/tailnet/native/go.mod
          cache-dependency-path: packages/tailnet/native/go.sum
      - uses: ./.github/actions/setup-zig
        if: contains(fromJSON(steps.plan.outputs.build), 'app') || contains(fromJSON(steps.plan.outputs.build), 'daemon')
        with:
          cache-key: native-release-linux-x64
      - name: Install native prerequisites only for changed artifacts
        if: contains(fromJSON(steps.plan.outputs.build), 'app') || contains(fromJSON(steps.plan.outputs.build), 'daemon') || steps.plan.outputs.package == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libglx-dev libgl-dev libegl-dev libasound2-dev libpulse-dev libwayland-dev libxss1 libsm6 libice6 dpkg-dev xdg-utils patchelf
      - name: Provision pinned AppImage tools only for repackaging
        if: steps.plan.outputs.package == 'true'
        run: cargo xtask appimage-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build only planned components and bootstrap packages
        if: steps.plan.outputs.no_changes != 'true'
        run: cargo xtask components build --plan artifacts/component-plan.json --target linux-x64
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.no_changes != 'true'
        with:
          name: native-packages-linux-x64
          path: |
            artifacts/component-plan.json
            artifacts/native/Paseo-Component-*
            artifacts/native/Passession-*
            artifacts/native/components-*.json
            artifacts/native/packages-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Complete successful no-change plan
        if: steps.plan.outputs.no_changes == 'true'
        run: echo 'All Linux component and package inputs match the trusted release; no native work or artifacts required.'
