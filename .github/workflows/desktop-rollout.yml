name: Native Desktop Rollout

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing canonical release tag (vX.Y.Z or vX.Y.Z-beta.N)
        required: true
        type: string
      rollout_hours:
        description: Total ramp duration since original release date; 0 admits everyone
        required: true
        type: string

concurrency:
  group: desktop-rollout-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # actions/checkout runs `git init`; a named default branch avoids git's hint.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  stamp:
    if: github.repository == 'emotionbug/Passession'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      SOURCE_TAG: ${{ inputs.tag }}
      NEW_HOURS: ${{ inputs.rollout_hours }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
      - name: Validate authenticated component feeds and preserve original rollout dates
        run: cargo xtask release rollout
